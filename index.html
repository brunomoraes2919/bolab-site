<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BOLAB — Bolos artesanais sob encomenda</title>
    <meta name="description" content="Delivery de bolos artesanais em Cuiabá e Várzea Grande. Peça um clássico ou monte o seu em 3D e receba com dia e horário marcados." />
    <meta name="theme-color" content="#FFFFFF" />
    <meta property="og:title" content="BOLAB — Delivery de bolos artesanais" />
    <meta property="og:description" content="Peça um clássico ou monte o seu bolo em 3D. Entrega com dia e horário marcados." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/icon-512.png" />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />

    <script>
      // DESEMPENHO DA ABERTURA (três atalhos; nenhum muda a aparência):
      //
      // 1. A imagem do primeiro banner do início começa a baixar junto com o resto. Antes ela só
      //    era pedida depois de todo o JavaScript rodar. Se trocar a imagem do primeiro banner
      //    em js/views/home.js (PROMOS), troque o arquivo aqui também.
      (function () {
        if (location.hash && location.hash !== '#' && location.hash !== '#/') return;
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.href = 'assets/img/cz-morango.webp';
        document.head.appendChild(link);
      })();

      // 2. A fonte da marca não segura a primeira pintura (a folha de estilo dela vem de outro
      //    servidor; no app, sem internet, a tela ficava esperando). Assim que a folha chega, o
      //    arquivo da fonte já é pedido, para o texto não "pular" depois de aparecer. Enquanto
      //    isso (ou sem internet), a loja usa a fonte do aparelho, ajustada em css/tokens.css.
      function bolabFonts(link) {
        if (link.rel === 'preload') {
          link.rel = 'stylesheet'; // a folha chegou: aplica (este mesmo aviso dispara de novo depois de aplicada)
          return;
        }
        link.onload = null;
        if (!document.fonts || !document.fonts.load) return;
        // Fonte variável: um arquivo só cobre todos os pesos (400 a 800).
        ['500', '700', '800'].forEach(function (w) {
          document.fonts.load(w + ' 1em "Plus Jakarta Sans"').catch(function () {});
        });
      }
    </script>
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap"
      onload="bolabFonts(this)"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet" />
    </noscript>

    <!-- 3. Os arquivos de JavaScript da primeira tela são pedidos todos de uma vez, em vez de um
         descobrir o outro em fila. Se criar um arquivo novo usado na abertura, pode acrescentar
         aqui; se esquecer, nada quebra (ele só carrega um pouco depois). -->
    <link rel="modulepreload" href="js/app.js" />
    <link rel="modulepreload" href="js/router.js" />
    <link rel="modulepreload" href="js/shell.js" />
    <link rel="modulepreload" href="js/store.js" />
    <link rel="modulepreload" href="js/ui.js" />
    <link rel="modulepreload" href="js/icons.js" />
    <link rel="modulepreload" href="js/components.js" />
    <link rel="modulepreload" href="js/data/site.js" />
    <link rel="modulepreload" href="js/data/products.js" />
    <link rel="modulepreload" href="js/data/photos.js" />
    <link rel="modulepreload" href="js/views/home.js" />

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/catalog.css" />
    <link rel="stylesheet" href="css/cart.css" />
    <link rel="stylesheet" href="css/account.css" />
    <link rel="stylesheet" href="css/customizer.css" />

    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.min.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body data-layout="default">
    <a class="skip-link" href="#/" data-skip>Pular para o conteúdo</a>
    <header id="header" class="header"></header>
    <nav id="subnav" class="subnav" aria-label="Seções da loja"></nav>
    <main id="app" tabindex="-1">
      <div class="boot" id="boot">
        <img src="assets/logo-mark.webp" alt="" width="60" height="92" />
      </div>
    </main>
    <footer id="footer" class="footer"></footer>
    <div id="cartbar" class="cartbar"></div>
    <nav id="tabbar" class="tabbar" aria-label="Navegação principal"></nav>

    <noscript>
      <p style="padding: 24px; text-align: center">Para usar a loja BOLAB, ative o JavaScript no seu navegador.</p>
    </noscript>
    <script>
      // Se algum arquivo essencial não chegar (rede instável), a pessoa vê um aviso com
      // "Tentar de novo" em vez de ficar olhando a logo para sempre.
      function bolabBootFail() {
        var boot = document.getElementById('boot');
        if (!boot || window.__bolabReady) return;
        boot.innerHTML =
          '<div class="boot__fail"><img src="assets/logo-mark.webp" alt="" width="48" height="74" />' +
          '<h1>Não conseguimos abrir a loja</h1><p>Confira sua conexão com a internet e tente de novo.</p>' +
          '<button class="btn" type="button" onclick="location.reload()">Tentar de novo</button></div>';
      }
      setTimeout(bolabBootFail, 12000);
    </script>
    <script type="module" src="js/app.js" onerror="bolabBootFail()"></script>
  </body>
</html>
